name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
            php-version: ${{ matrix.php-version }}
            tools: composer:v2
            coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup Node
        uses: actions/setup-node@v7 # v7
        with:
            node-version: '24'
            cache: 'npm'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Tests
        if: matrix.php-version != '8.5'
        run: php artisan test

      - name: Tests with coverage
        if: matrix.php-version == '8.5'
        run: vendor/bin/pest --coverage-clover=coverage.xml

      - name: Create coverage badge
        if: matrix.php-version == '8.5'
        run: php .github/scripts/badge.php coverage coverage.xml coverage.svg

      - name: Upload coverage badge
        if: matrix.php-version == '8.5'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage.svg

  badges:
    needs: ci
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
            php-version: '8.5'

      - name: Download coverage badge
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: badges

      - name: Create tests badge
        env:
          RESULT: ${{ needs.ci.result }}
        run: |
          mkdir -p badges
          php .github/scripts/badge.php status tests "$RESULT" badges/tests.svg

      - name: Publish badges
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-badges.sh badges
